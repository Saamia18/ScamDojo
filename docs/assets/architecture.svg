<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <!-- Neobrutalist Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#1B1F4B" flood-opacity="1" />
    </filter>
    <filter id="shadow-lg" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#1B1F4B" flood-opacity="1" />
    </filter>
    <!-- Marker for connecting arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1B1F4B" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="620" rx="16" fill="#EEF1F6" stroke="#1B1F4B" stroke-width="4" filter="url(#shadow-lg)" />

  <!-- Top Title Banner -->
  <rect x="30" y="24" width="900" height="60" rx="12" fill="#1B1F4B" />
  <text x="480" y="52" fill="#FFB400" font-family="'Trebuchet MS', 'Impact', sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="1.5">
    🥋 3-PILLAR HYBRID FUSION FORENSIC ENGINE
  </text>
  <text x="480" y="72" fill="#DCE4FF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="12" text-anchor="middle" letter-spacing="0.8">
    SUB-MILLISECOND MULTI-SIGNAL SCAM DETECTION • CLIENT-SIDE PRIVACY • NOISY-OR PROBABILITY
  </text>

  <!-- Connector Line 1: Input to Normalizer -->
  <line x1="480" y1="145" x2="480" y2="165" stroke="#1B1F4B" stroke-width="3" marker-end="url(#arrow)" />

  <!-- 1. Input Node -->
  <g filter="url(#shadow)">
    <rect x="230" y="100" width="500" height="46" rx="10" fill="#DCE4FF" stroke="#1B1F4B" stroke-width="3" />
    <text x="480" y="129" fill="#1B1F4B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="15" text-anchor="middle">
      📥 RAW INPUT: SMS Text • WhatsApp Screenshot (Client OCR) • UPI QR Code
    </text>
  </g>

  <!-- 2. Normalizer & De-obfuscator Node -->
  <g filter="url(#shadow)">
    <rect x="180" y="168" width="600" height="52" rx="10" fill="#FFE9A6" stroke="#1B1F4B" stroke-width="3" />
    <text x="480" y="193" fill="#1B1F4B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900" font-size="15" text-anchor="middle">
      ⚙️ DE-OBFUSCATION NORMALIZER (engine/normalize.py)
    </text>
    <text x="480" y="211" fill="#4A4F7A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="12" text-anchor="middle">
      Strips Cyrillic Homoglyphs (Раytm) • Zero-Width Characters • Leetspeak (b4nk) • Spaced-out Words (K Y C)
    </text>
  </g>

  <!-- Connector Lines 2: Normalizer branching into 3 Pillars -->
  <path d="M 480 220 L 480 238 L 170 238 L 170 258" stroke="#1B1F4B" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <line x1="480" y1="220" x2="480" y2="258" stroke="#1B1F4B" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 480 220 L 480 238 L 790 238 L 790 258" stroke="#1B1F4B" stroke-width="3" fill="none" marker-end="url(#arrow)" />

  <!-- 3. THE 3 FORENSIC PILLARS -->

  <!-- Pillar 1: Pure-Python Text Classifier -->
  <g filter="url(#shadow)">
    <rect x="30" y="260" width="280" height="110" rx="12" fill="#FFFFFF" stroke="#1B1F4B" stroke-width="3" />
    <rect x="30" y="260" width="280" height="28" rx="10" fill="#1B1F4B" />
    <text x="170" y="279" fill="#FFB400" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="13" text-anchor="middle">
      PILLAR 1: TEXT CLASSIFIER
    </text>
    <text x="170" y="306" fill="#1B1F4B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="13" text-anchor="middle">
      Pure-Python TF-IDF Model
    </text>
    <text x="170" y="324" fill="#4A4F7A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" text-anchor="middle">
      Learned Logistic Regression Weights
    </text>
    <text x="170" y="342" fill="#4A4F7A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" text-anchor="middle">
      Zero heavy ML runtime dependencies
    </text>
    <text x="170" y="360" fill="#1E9E5A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="11" text-anchor="middle">
      ⚡ Median Latency: 0.6 ms
    </text>
  </g>

  <!-- Pillar 2: 25 India-Specific Rules -->
  <g filter="url(#shadow)">
    <rect x="340" y="260" width="280" height="110" rx="12" fill="#FFFFFF" stroke="#1B1F4B" stroke-width="3" />
    <rect x="340" y="260" width="280" height="28" rx="10" fill="#1B1F4B" />
    <text x="480" y="279" fill="#FFB400" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="13" text-anchor="middle">
      PILLAR 2: EXPERT RULES
    </text>
    <text x="480" y="306" fill="#1B1F4B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="13" text-anchor="middle">
      25 India-Specific Heuristics
    </text>
    <text x="480" y="324" fill="#4A4F7A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" text-anchor="middle">
      KYC/PAN Expiry • Fake OTP Demands
    </text>
    <text x="480" y="342" fill="#4A4F7A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" text-anchor="middle">
      Electricity Cutoffs • Family Traps
    </text>
    <text x="480" y="360" fill="#1E9E5A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="11" text-anchor="middle">
      🇮🇳 Hindi, Hinglish, &amp; English
    </text>
  </g>

  <!-- Pillar 3: Link & Brand Autopsy -->
  <g filter="url(#shadow)">
    <rect x="650" y="260" width="280" height="110" rx="12" fill="#FFFFFF" stroke="#1B1F4B" stroke-width="3" />
    <rect x="650" y="260" width="280" height="28" rx="10" fill="#1B1F4B" />
    <text x="790" y="279" fill="#FFB400" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="13" text-anchor="middle">
      PILLAR 3: LINK &amp; BRAND AUTOPSY
    </text>
    <text x="790" y="306" fill="#1B1F4B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="13" text-anchor="middle">
      Domain Forensic Analyzer
    </text>
    <text x="790" y="324" fill="#4A4F7A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" text-anchor="middle">
      38+ Indian Brands (SBI, HDFC, Jio)
    </text>
    <text x="790" y="342" fill="#4A4F7A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11" text-anchor="middle">
      Catches Typosquats, APKs, IP Hosts
    </text>
    <text x="790" y="360" fill="#1E9E5A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="11" text-anchor="middle">
      💳 UPI Reverse-QR Fraud Detector
    </text>
  </g>

  <!-- Connector Lines 3: 3 Pillars merging into Fusion Hub -->
  <path d="M 170 370 L 170 395 L 480 395" stroke="#1B1F4B" stroke-width="3" fill="none" />
  <line x1="480" y1="370" x2="480" y2="415" stroke="#1B1F4B" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 790 370 L 790 395 L 480 395" stroke="#1B1F4B" stroke-width="3" fill="none" />

  <!-- 4. Noisy-OR Fusion Core Node -->
  <g filter="url(#shadow)">
    <rect x="180" y="418" width="600" height="64" rx="12" fill="#FFB400" stroke="#1B1F4B" stroke-width="3" />
    <text x="480" y="443" fill="#1B1F4B" font-family="'Trebuchet MS', sans-serif" font-weight="900" font-size="16" text-anchor="middle">
      ⚡ NOISY-OR PROBABILITY FUSION CORE (engine/fusion.py)
    </text>
    <text x="480" y="465" fill="#1B1F4B" font-family="'Courier New', monospace" font-weight="800" font-size="13" text-anchor="middle">
      Risk = 1 − (1 − 0.85·Text) × (1 − Rules) × (1 − 0.95·Links)
    </text>
  </g>

  <!-- Connector Lines 4: Fusion Hub to 3 Output Nodes -->
  <path d="M 480 482 L 480 502 L 160 502 L 160 520" stroke="#1B1F4B" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <line x1="480" y1="482" x2="480" y2="520" stroke="#1B1F4B" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 480 482 L 480 502 L 800 502 L 800 520" stroke="#1B1F4B" stroke-width="3" fill="none" marker-end="url(#arrow)" />

  <!-- 5. THREE FORENSIC OUTPUTS -->

  <!-- Output 1: Calibrated Verdict -->
  <g filter="url(#shadow)">
    <rect x="40" y="522" width="240" height="74" rx="10" fill="#D3F0E0" stroke="#1B1F4B" stroke-width="3" />
    <text x="160" y="546" fill="#1E9E5A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="13" text-anchor="middle">
      🎯 CALIBRATED VERDICT
    </text>
    <text x="160" y="565" fill="#1B1F4B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="12" text-anchor="middle">
      Scam (≥65%) • Safe (&lt;35%)
    </text>
    <text x="160" y="582" fill="#4A4F7A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11" text-anchor="middle">
      Confidence Reliability Score
    </text>
  </g>

  <!-- Output 2: Highlight Spans -->
  <g filter="url(#shadow)">
    <rect x="330" y="522" width="300" height="74" rx="10" fill="#FBD9D6" stroke="#1B1F4B" stroke-width="3" />
    <text x="480" y="546" fill="#E2362F" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="13" text-anchor="middle">
      🚨 RED-FLAG HIGHLIGHTS
    </text>
    <text x="480" y="565" fill="#1B1F4B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="12" text-anchor="middle">
      Exact Character Offset Spans
    </text>
    <text x="480" y="582" fill="#4A4F7A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11" text-anchor="middle">
      Visual Triggers &amp; Influential Words
    </text>
  </g>

  <!-- Output 3: 1930 Incident Packet -->
  <g filter="url(#shadow)">
    <rect x="680" y="522" width="240" height="74" rx="10" fill="#FADAEA" stroke="#1B1F4B" stroke-width="3" />
    <text x="800" y="546" fill="#D6247F" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="13" text-anchor="middle">
      📋 1930 EVIDENCE PACKET
    </text>
    <text x="800" y="565" fill="#1B1F4B" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="12" text-anchor="middle">
      Extracted Phone, UPI, &amp; Links
    </text>
    <text x="800" y="582" fill="#4A4F7A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="11" text-anchor="middle">
      SHA-256 Proof • cybercrime.gov.in
    </text>
  </g>

</svg>
