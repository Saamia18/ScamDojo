<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#1B1F4B" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="960" height="270" rx="14" fill="#1B1F4B" />

  <!-- Top Title -->
  <text x="480" y="32" fill="#FFB400" font-family="'Trebuchet MS', 'Impact', sans-serif" font-weight="900" font-size="18" text-anchor="middle" letter-spacing="2">
    👾 THE 5 NOTORIOUS SCAMMER BOSSES (BOSS RUSH ROSTER)
  </text>

  <!-- 5 Boss Cards Grid -->

  <!-- 1. KYC Kraken -->
  <g transform="translate(20, 50)" filter="url(#card-shadow)">
    <rect width="172" height="195" rx="10" fill="#FFFFFF" stroke="#1B1F4B" stroke-width="2.5" />
    <rect width="172" height="26" rx="8" fill="#DCE4FF" stroke="#1B1F4B" stroke-width="2.5" />
    <text x="86" y="18" fill="#1B1F4B" font-family="-apple-system, sans-serif" font-weight="900" font-size="12" text-anchor="middle">🐙 KYC KRAKEN</text>
    <text x="86" y="58" font-size="32" text-anchor="middle">🐙</text>
    <text x="86" y="82" fill="#E2362F" font-family="-apple-system, sans-serif" font-weight="800" font-size="10.5" text-anchor="middle">THREAT: ACCOUNT FREEZE</text>
    <rect x="12" y="94" width="148" height="42" rx="6" fill="#FADAEA" />
    <text x="86" y="110" fill="#1B1F4B" font-family="-apple-system, sans-serif" font-weight="700" font-size="9" text-anchor="middle">"YONO locked in 2 hrs.</text>
    <text x="86" y="124" fill="#1B1F4B" font-family="-apple-system, sans-serif" font-weight="700" font-size="9" text-anchor="middle">Click yono-kyc.top"</text>
    <rect x="12" y="145" width="148" height="38" rx="6" fill="#D3F0E0" />
    <text x="86" y="159" fill="#1E9E5A" font-family="-apple-system, sans-serif" font-weight="800" font-size="8.5" text-anchor="middle">WEAKNESS: Lookalike URLs</text>
    <text x="86" y="172" fill="#1B1F4B" font-family="-apple-system, sans-serif" font-weight="700" font-size="8.5" text-anchor="middle">Check bank app directly</text>
  </g>

  <!-- 2. Lottery Llama -->
  <g transform="translate(208, 50)" filter="url(#card-shadow)">
    <rect width="172" height="195" rx="10" fill="#FFFFFF" stroke="#1B1F4B" stroke-width="2.5" />
    <rect width="172" height="26" rx="8" fill="#FFE9A6" stroke="#1B1F4B" stroke-width="2.5" />
    <text x="86" y="18" fill="#1B1F4B" font-family="-apple-system, sans-serif" font-weight="900" font-size="12" text-anchor="middle">🦙 LOTTERY LLAMA</text>
    <text x="86" y="58" font-size="32" text-anchor="middle">🦙</text>
    <text x="86" y="82" fill="#E2362F" font-family="-apple-system, sans-serif" font-weight="800" font-size="10.5" text-anchor="middle">THREAT: ADVANCE FEE</text>
    <rect x="12" y="94" width="148" height="42" rx="6" fill="#FADAEA" />
    <text x="86" y="110" fill="#1B1F4B" font-family="-apple-system, sans-serif" font-weight="700" font-size="9" text-anchor="middle">"Won ₹15,00,000 Diwali</text>
    <text x="86" y="124" fill="#1B1F4B" font-family="-apple-system, sans-serif" font-weight="700" font-size="9" text-anchor="middle">Bumper! Pay ₹2,500 tax"</text>
    <rect x="12" y="145" width="148" height="38" rx="6" fill="#D3F0E0" />
    <text x="86" y="159" fill="#1E9E5A" font-family="-apple-system, sans-serif" font-weight="800" font-size="8.5" text-anchor="middle">WEAKNESS: Upfront Fee</text>
    <text x="86" y="172" fill="#1B1F4B" font-family="-apple-system, sans-serif" font-weight="700" font-size="8.5" text-anchor="middle">Real prizes never charge</text>
  </g>

  <!-- 3. OTP Octopus -->
  <g transform="translate(396, 50)" filter="url(#card-shadow)">
    <rect width="172" height="195" rx="10" fill="#FFFFFF" stroke="#1B1F4B" stroke-width="2.5" />
    <rect width="172" height="26" rx="8" fill="#FBD9D6" stroke="#1B1F4B" stroke-width="2.5" />
    <text x="86" y="18" fill="#E2362F" font-family="-apple-system, sans-serif" font-weight="900" font-size="12" text-anchor="middle">🐙 OTP OCTOPUS</text>
    <text x="86" y="58" font-size="32" text-anchor="middle">🤖</text>
    <text x="86" y="82" fill="#E2362F" font-family="-apple-system, sans-serif" font-weight="800" font-size="10.5" text-anchor="middle">THREAT: FRAUD IMPERSONATION</text>
    <rect x="12" y="94" width="148" height="42" rx="6" fill="#FADAEA" />
    <text x="86" y="110" fill="#1B1F4B" font-family="-apple-system, sans-serif" font-weight="700" font-size="9" text-anchor="middle">"Bank fraud squad: Share</text>
    <text x="86" y="124" fill="#1B1F4B" font-family="-apple-system, sans-serif" font-weight="700" font-size="9" text-anchor="middle">OTP to stop ₹49,999 debit"</text>
    <rect x="12" y="145" width="148" height="38" rx="6" fill="#D3F0E0" />
    <text x="86" y="159" fill="#1E9E5A" font-family="-apple-system, sans-serif" font-weight="800" font-size="8.5" text-anchor="middle">WEAKNESS: Golden Rule</text>
    <text x="86" y="172" fill="#1B1F4B" font-family="-apple-system, sans-serif" font-weight="700" font-size="8.5" text-anchor="middle">Banks never ask for OTPs</text>
  </g>

  <!-- 4. Job Offer Jackal -->
  <g transform="translate(584, 50)" filter="url(#card-shadow)">
    <rect width="172" height="195" rx="10" fill="#FFFFFF" stroke="#1B1F4B" stroke-width="2.5" />
    <rect width="172" height="26" rx="8" fill="#FADAEA" stroke="#1B1F4B" stroke-width="2.5" />
    <text x="86" y="18" fill="#D6247F" font-family="-apple-system, sans-serif" font-weight="900" font-size="12" text-anchor="middle">🐺 JOB JACKAL</text>
    <text x="86" y="58" font-size="32" text-anchor="middle">🐺</text>
    <text x="86" y="82" fill="#E2362F" font-family="-apple-system, sans-serif" font-weight="800" font-size="10.5" text-anchor="middle">THREAT: TASK &amp; PREPAID SCAM</text>
    <rect x="12" y="94" width="148" height="42" rx="6" fill="#FADAEA" />
    <text x="86" y="110" fill="#1B1F4B" font-family="-apple-system, sans-serif" font-weight="700" font-size="9" text-anchor="middle">"Earn ₹3,000/day rating</text>
    <text x="86" y="124" fill="#1B1F4B" font-family="-apple-system, sans-serif" font-weight="700" font-size="9" text-anchor="middle">hotels. Deposit ₹500 first"</text>
    <rect x="12" y="145" width="148" height="38" rx="6" fill="#D3F0E0" />
    <text x="86" y="159" fill="#1E9E5A" font-family="-apple-system, sans-serif" font-weight="800" font-size="8.5" text-anchor="middle">WEAKNESS: Pay to Work</text>
    <text x="86" y="172" fill="#1B1F4B" font-family="-apple-system, sans-serif" font-weight="700" font-size="8.5" text-anchor="middle">Legit jobs never charge fees</text>
  </g>

  <!-- 5. Courier Cobra -->
  <g transform="translate(772, 50)" filter="url(#card-shadow)">
    <rect width="172" height="195" rx="10" fill="#FFFFFF" stroke="#1B1F4B" stroke-width="2.5" />
    <rect width="172" height="26" rx="8" fill="#D3F0E0" stroke="#1B1F4B" stroke-width="2.5" />
    <text x="86" y="18" fill="#1E9E5A" font-family="-apple-system, sans-serif" font-weight="900" font-size="12" text-anchor="middle">🐍 COURIER COBRA</text>
    <text x="86" y="58" font-size="32" text-anchor="middle">🐍</text>
    <text x="86" y="82" fill="#E2362F" font-family="-apple-system, sans-serif" font-weight="800" font-size="10.5" text-anchor="middle">THREAT: REDELIVERY BAIT</text>
    <rect x="12" y="94" width="148" height="42" rx="6" fill="#FADAEA" />
    <text x="86" y="110" fill="#1B1F4B" font-family="-apple-system, sans-serif" font-weight="700" font-size="9" text-anchor="middle">"India Post: parcel held.</text>
    <text x="86" y="124" fill="#1B1F4B" font-family="-apple-system, sans-serif" font-weight="700" font-size="9" text-anchor="middle">Pay ₹25 at bit.ly/ip-reship"</text>
    <rect x="12" y="145" width="148" height="38" rx="6" fill="#D3F0E0" />
    <text x="86" y="159" fill="#1E9E5A" font-family="-apple-system, sans-serif" font-weight="800" font-size="8.5" text-anchor="middle">WEAKNESS: Shortened Links</text>
    <text x="86" y="172" fill="#1B1F4B" font-family="-apple-system, sans-serif" font-weight="700" font-size="8.5" text-anchor="middle">Postal uses indiapost.gov.in</text>
  </g>

</svg>
